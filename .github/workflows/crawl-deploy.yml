name: 抓取文档并部署

on:
  schedule:
    - cron: "0 2 * * *"   # 每天 UTC 02:00（北京时间 10:00）自动抓取
  workflow_dispatch: {}    # 支持手动触发
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl-deploy
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取最新文档
        run: python3 crawler/crawl.py

      - name: 同步数据到站点
        run: |
          mkdir -p site/data
          cp docs-data/*.md docs-data/index.json site/data/
          echo "pages: $(ls site/data/*.md | wc -l)"

      - name: 提交文档更新
        run: |
          git config user.name "docs-bot"
          git config user.email "actions@github.com"
          git add docs-data site/data
          if git diff --cached --quiet; then
            echo "文档无更新"
          else
            git commit -m "docs: 同步官方文档 $(date -u +%F)"
            git push
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
